[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "money-manager"
version = "0.2.1"
description = "Korean resident portfolio management and tax simulations"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
ui = ["streamlit>=1.50,<2", "tzdata>=2024.1"]
ocr = ["Pillow>=10", "pytesseract>=0.3.13"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
money_manager = ["migrations/*.sql"]
